<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Data</title>
</head>
<body>
    <h1>Product Data</h1>
    <table border="1" cellpadding="10">
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Price</th>
                <th>Category</th>
                <th>Rating</th>
            </tr>
        </thead>
        <tbody id="tabledata">
            
        </tbody>
    </table>

    <script>
        async function getdata() {
            
            var res = await fetch("https://dummyjson.com/products");
            
            
            var data = await res.json(); 
            
            var table = "";
            
        
            data.products.forEach(function(item) {
                
                table += `
                    <tr>
                        <td>${item.id}</td>
                        <td>${item.title}</td>
                        <td>$${item.price}</td>
                        <td>${item.category}</td>
                        <td>${item.rating}</td>
                    </tr>
                `;
            });
            
            document.getElementById("tabledata").innerHTML = table;
        }
        
        getdata();
    </script>
</body>
</html>
